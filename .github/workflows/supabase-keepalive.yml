name: Supabase keepalive

# Supabase pausa proyectos del plan Free tras 7 días sin suficiente
# "user database activity". Los docs piden unas pocas queries por día:
# https://supabase.com/docs/guides/platform/free-project-pausing
#
# Hay dos proyectos, y el riesgo no es el mismo en cada uno:
#
# - **producción** ya está deployada, así que el cron de Vercel
#   (`/api/cron/liberar-expiradas`, diario) más el tráfico real generan
#   actividad de sobra. Su ping quedó redundante; se mantiene como red de
#   seguridad porque cuesta tres queries al día.
# - **sfs-dev** no recibe tráfico: sólo lo toca `pnpm dev` cuando alguien está
#   programando. Una semana sin tocar el proyecto y se pausa. Para esta base el
#   workflow no es redundante — es lo único que la mantiene viva.
#
# Un job por entorno (matrix) y NO dos pasos en el mismo job, a propósito: con
# `set -euo pipefail` un fallo en el primer paso aborta el job y el segundo
# nunca corre. Dicho de otra forma, un problema en producción haría que dev se
# pausara en silencio. Con `fail-fast: false` cada base se pingea por su cuenta.

on:
  schedule:
    # 3 veces al día (UTC). Margen amplio: la ventana de Supabase es de 7 días,
    # y los cron de GitHub Actions pueden retrasarse bajo carga.
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping ${{ matrix.entorno }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - entorno: produccion
            secreto: DATABASE_URL
          - entorno: sfs-dev
            secreto: DATABASE_URL_DEV

    steps:
      - name: Ping la base de datos
        env:
          # Usar la connection string del pooler de Supabase (Supavisor), no la
          # conexión directa: los runners de GitHub no tienen IPv6.
          DATABASE_URL: ${{ secrets[matrix.secreto] }}
          # El nombre del secret viaja aparte para poder nombrarlo en el error.
          SECRETO: ${{ matrix.secreto }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Falta el secret ${SECRETO} en el repositorio."
            exit 1
          fi

          # Lectura trivial sobre una tabla real: cuenta como query de usuario
          # y no modifica nada.
          psql "${DATABASE_URL}" --no-psqlrc --quiet --tuples-only \
            -c "select 'keepalive ok at ' || now() || ' — reservas: ' || count(*) from reservas;"
